function updateViewport(){var offset=Math.max(0,currentRow-1)*294;document.getElementById('appArea').style.transform='translateY(-'+offset+'px)';document.getElementById('hero').style.opacity='1';document.getElementById('rowBand').style.opacity=currentRow===0?'0':'1';}
function focusMain(){if(currentRow===0){toolButtons[toolIndex].focus();return;}lastTile=Math.min(11,(currentRow-1)*4+currentCol);tiles[lastTile].focus();}
function moveTo(index){index=Math.max(0,Math.min(11,index));currentRow=Math.floor(index/4)+1;currentCol=index%4;focusMain();}
function applyApp(item,index){var existing=-1;for(var i=0;i<cards.length;i++)if(cards[i].name===item.name)existing=i;if(existing>=0&&existing!==index){var displaced=cards[index];cards[index]=cards[existing];cards[existing]=displaced;}else{var original=null;for(var j=0;j<originalCards.length;j++)if(originalCards[j].name===item.name)original=originalCards[j];cards[index]=original?JSON.parse(JSON.stringify(original)):{name:item.name,config:JSON.parse(JSON.stringify(item.config)),image:item.image};}save();pickSlot=false;replaceIndex=null;render();moveTo(index);report('Tarjeta actualizada');}
function activate(index){if(pickSlot){if(index===11)return report('Más apps permanece en la última casilla');var chosen=pendingApp;if(!chosen)return report('Vuelve a elegir una app de la biblioteca');applyApp(chosen,index);return;}
if(moving){moving=false;save();report('Orden guardado');render();moveTo(index);return;}if(index===11)return openLibrary();launch(cards[index]);}
function openActions(index){if(index===11)return openLibrary();libraryReturn=index;showOptions(cards[index].name,[{label:'Mover tarjeta',action:function(){closeOverlay();moving=true;moveTo(index);report('Mover: flechas para cambiar de lugar · OK o Atrás para guardar');}},{label:'Cambiar por otra app',action:function(){openLibrary(index);}},{label:'Abrir app',action:function(){closeOverlay();launch(cards[index]);}}]);}
function showOptions(title,list){overlayMode='options';document.getElementById('libraryModal').setAttribute('data-mode','options');options=list;optionIndex=0;document.getElementById('libraryModal').style.display='flex';document.getElementById('libraryTitle').textContent=title;document.getElementById('libraryHint').textContent='OK para elegir · Atrás para volver';var grid=document.getElementById('libraryGrid');grid.className='optionList';grid.textContent='';for(var i=0;i<list.length;i++){var b=document.createElement('button');b.className='libOption';b.textContent=list[i].label;b.onclick=list[i].action;b.onfocus=function(){optionIndex=Array.prototype.indexOf.call(this.parentNode.children,this);};grid.appendChild(b);}grid.children[0].focus();}
function closeOverlay(){overlayMode='';document.getElementById('libraryModal').style.display='none';moveTo(libraryReturn);}
function openLibrary(target){replaceIndex=typeof target==='number'&&target>=0&&target<11?target:null;moving=false;libraryReturn=lastTile;overlayMode='library';libraryIndex=0;document.getElementById('libraryModal').style.display='flex';paintLibrary();}
function paintLibrary(){overlayMode='library';document.getElementById('libraryModal').setAttribute('data-mode','library');document.getElementById('libraryTitle').textContent='Biblioteca de apps';var first=Math.floor(libraryIndex/8)*8,last=Math.min(catalog.length,first+8);document.getElementById('libraryHint').textContent=(first+1)+'–'+last+' de '+catalog.length+' · Catálogo SmartCast · La disponibilidad depende de la app y la región';var grid=document.getElementById('libraryGrid');grid.className='libraryGrid';grid.textContent='';for(var i=first;i<last;i++){(function(index){var item=catalog[index],b=document.createElement('button');b.className='libraryCard';b.style.left=((index-first)%4*366)+'px';b.style.top=(Math.floor((index-first)/4)*220)+'px';if(item.image){var image=document.createElement('img');image.src=item.image;image.alt='';image.onerror=function(){this.style.visibility='hidden';};b.appendChild(image);}var text=document.createElement('strong');text.textContent=item.name;b.appendChild(text);var hint=document.createElement('small');hint.textContent=item.blocked?'Falló en las pruebas de esta TV':'Abrir o poner en Inicio';b.appendChild(hint);b.onclick=function(){libraryIndex=index;if(item.blocked){showOptions(item.name,[{label:'Falló en esta TV · Volver',action:paintLibrary}]);return;}pendingApp=item;showOptions(item.name,[{label:'Abrir app',action:function(){closeOverlay();launch(item);}},{label:replaceIndex===null?'Poner en Inicio…':'Sustituir tarjeta',action:function(){var chosen=JSON.parse(JSON.stringify(item)),target=replaceIndex;closeOverlay();pendingApp=chosen;if(target!==null){applyApp(chosen,target);return;}pickSlot=true;report('Elige la tarjeta que quieres sustituir y pulsa OK · Atrás para cancelar');}},{label:'Volver a biblioteca',action:paintLibrary}]);};b.onfocus=function(){libraryIndex=index;};grid.appendChild(b);})(i);}grid.children[libraryIndex-first].focus();}
function closeInputs(){modal=false;document.getElementById('inputModal').style.display='none';currentRow=0;toolButtons[toolIndex].focus();}
function openInputs(){document.getElementById('inputModal').setAttribute('data-panel','inputs');modalMode='inputs';document.querySelector('.panel h2').textContent='Entradas';document.querySelector('.panel p').textContent='Selecciona una entrada · Atrás para cerrar';modal=true;inputIndex=0;inputButtons=[];document.getElementById('inputs').textContent='';document.getElementById('inputModal').style.display='flex';document.getElementById('inputStatus').textContent='Buscando entradas de la TV…';ready(function(e){if(e){document.getElementById('inputStatus').textContent=e;return;}api('/menu_native/dynamic/tv_settings/devices','GET',null,function(e,r){if(e){document.getElementById('inputStatus').textContent=e;return;}var items=r.ITEMS||[],list=[];for(var i=0;i<items.length;i++)if(items[i].CNAME==='current_inputs'&&Array.isArray(items[i].VALUE))list=items[i].VALUE;for(var j=0;j<list.length;j++){var v=list[j];if(!v.ENABLED||v.VISIBLE===false||['cast','watchfree','usb'].indexOf(v.CNAME)!==-1)continue;var b=document.createElement('button');b.className='input';var t=document.createElement('strong');t.textContent=v.CUSTOM_NAME||v.NAME;b.appendChild(t);var sub=document.createElement('span');sub.textContent=v.NAME+(v.SELECTED?' · En uso':v.CEC_OBJECT?' · Dispositivo detectado':'');b.appendChild(sub);b.setAttribute('data-input',v.NAME);b.onclick=function(){selectInput(this.getAttribute('data-input'));};b.onfocus=function(){inputIndex=inputButtons.indexOf(this);};document.getElementById('inputs').appendChild(b);inputButtons.push(b);}document.getElementById('inputStatus').textContent=inputButtons.length?'':'No se encontraron entradas disponibles';if(modal&&inputButtons.length)inputButtons[0].focus();});});}
function openWifi(){document.getElementById('inputModal').setAttribute('data-panel','wifi');modalMode='wifi';modal=true;inputButtons=[];inputIndex=0;document.getElementById('inputModal').style.display='flex';document.querySelector('.panel h2').textContent='Conexión de red';document.querySelector('.panel p').textContent='Información actual de la TV';document.getElementById('inputs').textContent='';document.getElementById('inputStatus').textContent='Consultando…';ready(function(e){if(e)return document.getElementById('inputStatus').textContent=e;api('/menu_native/dynamic/tv_settings/network','GET',null,function(e,r){if(e)return document.getElementById('inputStatus').textContent=e;var fields={connection_type:'Tipo de conexión',connection_status:'Estado',current_ssid_name:'Red',ip_address:'Dirección IP'};var items=r.ITEMS||[];for(var i=0;i<items.length;i++){var item=items[i];if(!fields[item.CNAME])continue;var el=document.createElement('div');el.className='network-detail';var label=document.createElement('small');label.textContent=fields[item.CNAME];el.appendChild(label);var value=document.createElement('span');value.textContent=item.VALUE||'No disponible';el.appendChild(value);document.getElementById('inputs').appendChild(el);}var b=document.createElement('button');b.className='input';b.textContent='Cerrar';b.onclick=closeInputs;document.getElementById('inputs').appendChild(b);inputButtons=[b];document.getElementById('inputStatus').textContent='Los ajustes de red se cambian desde el menú de la TV';if(modal)b.focus();});});}
inputButton.onclick=openInputs;wifiButton.onclick=openWifi;settingsButton.onclick=function(){ready(function(e){if(e)return report(e);api('/key_command/','PUT',{KEYLIST:[{CODESET:4,CODE:8,ACTION:'KEYPRESS'}]},done);});};for(var t=0;t<toolButtons.length;t++){(function(index){toolButtons[index].onfocus=function(){currentRow=0;toolIndex=index;document.getElementById('focusedTitle').textContent=['Tus dispositivos','Tu conexión','Ajustes'][index];updateViewport();};})(t);}
function back(){if(overlayMode){closeOverlay();return;}if(modal){closeInputs();return;}if(moving){moving=false;save();render();moveTo(lastTile);report('Orden guardado');return;}if(pickSlot){pickSlot=false;report('Cambio cancelado');return;}moveTo(0);}
function arrow(k){if(overlayMode==='library'){var next=libraryIndex+(k===37?-1:k===39?1:k===38?-4:4);if(next<0||next>=catalog.length)return;libraryIndex=next;paintLibrary();return;}if(overlayMode==='options'){optionIndex=Math.max(0,Math.min(options.length-1,optionIndex+(k===38?-1:k===40?1:0)));document.getElementById('libraryGrid').children[optionIndex].focus();return;}if(modal){if(!inputButtons.length)return;inputIndex=Math.max(0,Math.min(inputButtons.length-1,inputIndex+(k===38?-1:k===40?1:0)));inputButtons[inputIndex].focus();return;}if(moving){var next=lastTile+(k===37?-1:k===39?1:k===38?-4:4);if(next<0||next>=11)return;var tmp=cards[lastTile];cards[lastTile]=cards[next];cards[next]=tmp;render();moveTo(next);return;}if(currentRow===0){if(k===37)toolIndex=Math.max(0,toolIndex-1);if(k===39)toolIndex=Math.min(2,toolIndex+1);if(k===40){currentRow=1;currentCol=lastTile%4;}focusMain();return;}var col=lastTile%4;if(k===38&&lastTile<4){currentRow=0;focusMain();return;}var next=lastTile;if(k===37&&col>0)next--;if(k===39&&col<3)next++;if(k===38)next-=4;if(k===40)next+=4;if(next>=0&&next<12)moveTo(next);}
function pressOK(){if(overlayMode==='library'){document.getElementById('libraryGrid').children[libraryIndex%8].click();return;}if(overlayMode==='options'){options[optionIndex].action();return;}if(modal){if(inputButtons.length)inputButtons[inputIndex].click();return;}if(currentRow===0){toolButtons[toolIndex].click();return;}activate(lastTile);}
document.addEventListener('keydown',function(e){var k=e.keyCode;if([8,27,461,10009].indexOf(k)!==-1){e.preventDefault();back();return;}if([37,38,39,40].indexOf(k)!==-1){e.preventDefault();arrow(k);return;}if(k!==13)return;e.preventDefault();if(held)return;held=true;heldLong=false;if(overlayMode||modal||currentRow===0||moving||pickSlot||lastTile===11){heldLong=true;pressOK();return;}heldTimer=setTimeout(function(){heldLong=true;openActions(lastTile);},650);});
document.addEventListener('keyup',function(e){if(e.keyCode!==13)return;e.preventDefault();if(!held)return;clearTimeout(heldTimer);held=false;if(!heldLong)pressOK();});
window.addEventListener('blur',function(){clearTimeout(heldTimer);held=false;heldLong=true;});
load();render();try{var last=localStorage.getItem('vizioHome.lastSelected');for(var s=0;s<cards.length;s++)if(cards[s].name===last){currentRow=Math.floor(s/4)+1;currentCol=s%4;lastTile=s;break;}}catch(ignore){}focusMain();report('Presiona OK para acceder y mantén OK para mover o cambiar una tarjeta');
})();
